<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIR FREE REWARDS</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #splash { position: fixed; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; transition: 0.8s; }
        .truck { width: 280px; border-radius: 15px; border: 2px solid #00fbff; box-shadow: 0 0 20px #00fbff; }
        #login-screen { display: none; text-align: center; }
        .btn-google { background: white; color: #444; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; display: inline-flex; align-items: center; margin-top: 30px; }
    </style>
</head>
<body>
    <div id="splash">
        <img src="1000064821.png" class="truck" onerror="this.src='https://raw.githubusercontent.com/hamidmir12390-creator/Mir-Rewards-/main/1000064821.png'">
        <h1 style="color: #00fbff; margin-top: 20px;">MIR FREE REWARDS 💎</h1>
    </div>
    <div id="login-screen">
        <h1>Welcome Back!</h1>
        <button class="btn-google" onclick="signIn()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" style="width:24px; margin-right:10px;">
            Sign in with Google
        </button>
    </div>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD0AZG6D8H-OZOJK0s5sDyVJ6BLJJKVszc",
          authDomain: "mir-free-rewards-log-and-earn.firebaseapp.com",
          projectId: "mir-free-rewards-log-and-earn",
          appId: "1:1055267295995:web:35ebcfaa35a650a832165e"
        };
        firebase.initializeApp(firebaseConfig);
        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('login-screen').style.display = 'block';
            }, 800);
        }, 3000);
        function signIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).then((res) => {
                localStorage.setItem("userName", res.user.displayName);
                localStorage.setItem("userPic", res.user.photoURL);
                window.location.href = "dashboard.html";
            }).catch(err => alert("Error: " + err.message));
        }
    </script>
</body>
    </html>
