<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIR FREE REWARDS</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        body { margin: 0; background-color: #0b0d0f; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #splash-screen { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #1a1c1e, #000); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; transition: 0.8s; }
        .truck-logo { width: 280px; border-radius: 15px; box-shadow: 0 0 25px rgba(0, 251, 255, 0.4); animation: pulse 2s infinite; }
        #login-screen { display: none; text-align: center; animation: fadeIn 1s; padding: 20px; }
        .btn-google { background: white; color: #444; border: none; padding: 14px 28px; font-size: 18px; font-weight: 600; border-radius: 50px; cursor: pointer; display: inline-flex; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-top: 30px; transition: 0.3s; }
        .btn-google img { width: 24px; margin-right: 15px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="https://i.ibb.co/LhyYmPB/1000064821.jpg" alt="Mir Truck" class="truck-logo">
        <h1 style="color: #00fbff; margin-top: 20px; letter-spacing: 2px;">MIR FREE REWARDS 💎</h1>
    </div>

    <div id="login-screen">
        <h1 style="font-size: 32px;">Welcome Back!</h1>
        <p style="color: #aaa;">Login with Google to start earning Blue Diamonds.</p>
        <button class="btn-google" onclick="signInWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" alt="G">
            Sign in with Google
        </button>
    </div>

    <script>
        // --- Aapka Firebase Config ---
        const firebaseConfig = {
          apiKey: "AIzaSyD0AZG6D8H-OZOJK0s5sDyVJ6BLJJKVszc",
          authDomain: "mir-free-rewards-log-and-earn.firebaseapp.com",
          databaseURL: "https://mir-free-rewards-log-and-earn-default-rtdb.firebaseio.com",
          projectId: "mir-free-rewards-log-and-earn",
          storageBucket: "mir-free-rewards-log-and-earn.firebasestorage.app",
          messagingSenderId: "1055267295995",
          appId: "1:1055267295995:web:35ebcfaa35a650a832165e",
          measurementId: "G-V5CGH67MPE"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Splash timing
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('login-screen').style.display = 'block';
            }, 800);
        }, 3500);

        // Google Login Function
        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                alert("Namaste " + result.user.displayName + "! Login Successful.");
                // Agle step mein hum yahan dashboard ka link denge
            }).catch((error) => {
                console.error(error);
                alert("Galti hui: " + error.message);
            });
        }
    </script>
</body>
</html>
