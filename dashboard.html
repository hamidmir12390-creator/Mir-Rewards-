<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MIR FREE REWARDS</title>
    <style>
        body { margin: 0; background: #0b0d0f; color: white; font-family: sans-serif; text-align: center; }
        .header { background: #1a1c1e; padding: 15px; border-bottom: 2px solid #00fbff; display: flex; justify-content: space-between; align-items: center; }
        .user-img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #00fbff; }
        .wallet { background: rgba(0,251,255,0.05); margin: 15px; padding: 20px; border-radius: 15px; border: 1px solid #00fbff; }
        .bal-text { font-size: 35px; color: #00fbff; font-weight: bold; }
        
        .task-card { background: #1c1f24; margin: 15px; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border-left: 6px solid #ffcc00; }
        .task-info { display: flex; align-items: center; gap: 12px; text-align: left; }
        .claim-btn { background: #ffcc00; color: black; border: none; padding: 10px 22px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .seat { background: #161b22; padding: 15px; border-radius: 12px; border: 1px solid #30363d; font-size: 14px; }

        /* Popup */
        #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .popup-box { background: #fffbe6; color: #333; padding: 30px; border-radius: 20px; width: 80%; }
        .ok-btn { background: #4caf50; color: white; border: none; padding: 12px 45px; border-radius: 10px; margin-top: 15px; font-size: 18px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="" id="uPic" class="user-img">
            <span id="uName">Loading...</span>
        </div>
        <div style="color:#00fbff; font-weight:bold;">MIR REWARDS</div>
    </div>

    <div class="wallet">
        <p style="margin:0; font-size:12px; color:#aaa;">YOUR BALANCE</p>
        <div class="bal-text">💎 <span id="balance">0</span></div>
        <p style="margin:5px 0 0; font-size:11px; color:#00fbff;">Keep earning to withdraw!</p>
    </div>

    <div class="task-card">
        <div class="task-info">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M6 3L3 8L12 21L21 8L18 3H6Z" fill="#00FBFF" stroke="white" stroke-width="1.5"/></svg>
            <div>
                <b style="font-size:16px;">10 Diamonds</b><br>
                <span style="color:#aaa; font-size:12px;">20 Leaderboard Points</span>
            </div>
        </div>
        <button class="claim-btn" onclick="claimReward()">CLAIM</button>
    </div>

    <div class="grid">
        <div class="seat">🎡<br>Lucky Spin</div>
        <div class="seat">🎁<br>Daily Gift</div>
        <div class="seat">📺<br>Watch Video</div>
        <div class="seat">💰<br>Withdraw</div>
    </div>

    <div id="popup">
        <div class="popup-box">
            <h2 style="color:#d4a017;">Congratulations!</h2>
            <p>You Earned 10 Diamonds</p>
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none"><path d="M6 3L3 8L12 21L21 8L18 3H6Z" fill="#00FBFF" stroke="#333" stroke-width="1"/></svg><br>
            <button class="ok-btn" onclick="addMoney()">OK</button>
        </div>
    </div>

    <script>
        let bal = parseInt(localStorage.getItem("uBal")) || 0;
        document.getElementById('balance').innerText = bal;
        document.getElementById('uName').innerText = localStorage.getItem("userName") || "User";
        document.getElementById('uPic').src = localStorage.getItem("userPic") || "https://www.w3schools.com/howto/img_avatar.png";

        function claimReward() {
            alert("Loading Ad...");
            setTimeout(() => {
                document.getElementById('popup').style.display = 'flex';
            }, 1000);
        }

        function addMoney() {
            bal += 10;
            localStorage.setItem("uBal", bal);
            document.getElementById('balance').innerText = bal;
            document.getElementById('popup').style.display = 'none';
        }
    </script>
</body>
</html>
