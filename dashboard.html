<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIR REWARDS - DASHBOARD</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Arial', sans-serif; }
        .header { background: #111; padding: 15px; border-bottom: 2px solid #00fbff; display: flex; justify-content: space-between; }
        
        /* Stats Table */
        .stats-container { display: flex; justify-content: space-around; background: #1a1a1a; margin: 10px; padding: 15px; border-radius: 10px; border: 1px solid #00fbff; }
        .stat-item { text-align: center; }
        .stat-val { font-size: 22px; color: #00fbff; font-weight: bold; }

        /* CLAIM BOX - TOP PRIORITY */
        .claim-section { background: #222; margin: 15px; padding: 20px; border-radius: 15px; border-left: 8px solid #ffcc00; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(255, 204, 0, 0.2); }
        .claim-btn { background: #ffcc00; color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* SPIN BOX - SEPARATE */
        .spin-container { background: #111; margin: 15px; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        .wheel-box { width: 220px; height: 220px; margin: 0 auto; border-radius: 50%; border: 5px solid #00fbff; display: flex; align-items: center; justify-content: center; font-size: 50px; transition: 4s cubic-bezier(0.1, 0, 0.2, 1); background: radial-gradient(circle, #222, #000); }
        .spin-trigger { background: #00fbff; color: #000; border: none; padding: 15px 45px; border-radius: 50px; font-weight: bold; margin-top: 20px; font-size: 18px; width: 100%; }

        /* Popup */
        #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .popup-box { background: #fff; color: #000; padding: 30px; border-radius: 20px; width: 80%; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <span id="uName">Mir Hamid</span>
        <span style="color:#00fbff">MIR REWARDS</span>
    </div>

    <div class="stats-container">
        <div class="stat-item"><div class="stat-val">💎 <span id="dbBal">0</span></div><small>Diamonds</small></div>
        <div class="stat-item"><div class="stat-val">🎟️ <span id="dbVch">0</span></div><small>Vouchers</small></div>
    </div>

    <div class="claim-section">
        <div style="text-align:left">
            <b style="font-size:20px; color:#ffcc00;">Daily Reward</b><br>
            <span style="font-size:14px;">10 Diamonds & 20 Points</span>
        </div>
        <button class="claim-btn" onclick="claimDaily()">CLAIM</button>
    </div>

    <div class="spin-container">
        <h3 style="margin-top:0; color:#00fbff;">LUCKY SPIN</h3>
        <div id="wheel" class="wheel-box">🎡</div>
        <button class="spin-trigger" onclick="handleSpin()">SPIN NOW</button>
        <p style="margin-top:10px; font-size:13px; color:#aaa;">Spins Left: <span id="spLimit">30</span>/30</p>
        <button onclick="buyVoucher()" style="background:none; border:1px solid #555; color:#ccc; padding:8px 20px; border-radius:5px; width:100%;">Buy Voucher (5 💎)</button>
    </div>

    <div id="popup">
        <div class="popup-box">
            <h2 id="popT">Success!</h2>
            <p id="popM"></p>
            <button onclick="document.getElementById('popup').style.display='none'" style="background:#00fbff; border:none; padding:10px 40px; border-radius:10px; font-weight:bold;">OK</button>
        </div>
    </div>

    <script>
        let d = parseInt(localStorage.getItem("uBal")) || 0;
        let v = parseInt(localStorage.getItem("uVch")) || 0;
        let s = parseInt(localStorage.getItem("uSpins")) ?? 30;

        function refresh() {
            document.getElementById('dbBal').innerText = d;
            document.getElementById('dbVch').innerText = v;
            document.getElementById('spLimit').innerText = s;
            localStorage.setItem("uBal", d);
            localStorage.setItem("uVch", v);
            localStorage.setItem("uSpins", s);
        }
        refresh();

        function claimDaily() {
            d += 10; refresh();
            showPopup("Claimed!", "Added 10 Diamonds & 20 Leaderboard Points!");
        }

        function buyVoucher() {
            if(d >= 5) { d -= 5; v += 1; refresh(); } 
            else { alert("Need 5 Diamonds!"); }
        }

        function handleSpin() {
            if(v <= 0) return alert("Buy a Voucher first!");
            if(s <= 0) return alert("Daily limit reached!");

            v -= 1; s -= 1; refresh();
            let deg = Math.floor(Math.random() * 3600) + 360;
            document.getElementById('wheel').style.transform = `rotate(${deg}deg)`;

            setTimeout(() => {
                let prize = (Math.random() < 0.05) ? 10 : 5;
                d += prize; refresh();
                showPopup("Winner!", "You won " + prize + " Diamonds!");
            }, 4000);
        }

        function showPopup(t, m) {
            document.getElementById('popT').innerText = t;
            document.getElementById('popM').innerText = m;
            document.getElementById('popup').style.display = 'flex';
        }
    </script>
</body>
</html>
