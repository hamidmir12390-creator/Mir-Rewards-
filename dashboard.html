<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mir Rewards - Pro</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; text-align: center; }
        .header { background: #111; padding: 15px; border-bottom: 2px solid #00fbff; display: flex; justify-content: space-between; align-items: center; }
        .wallet-bar { background: #111; margin: 10px; padding: 15px; border-radius: 10px; display: flex; justify-content: space-around; border: 1px solid #333; }
        .stat { font-size: 20px; font-weight: bold; color: #00fbff; }
        
        /* Claim Task - Now on Top */
        .task-top { background: #1c1f24; margin: 15px; padding: 15px; border-radius: 12px; border-left: 6px solid #ffcc00; display: flex; justify-content: space-between; align-items: center; }
        .claim-btn { background: #ffcc00; color: black; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }

        /* Spin Section */
        .spin-box { background: #0a0a0a; margin: 15px; padding: 20px; border-radius: 20px; border: 1px solid #222; }
        .wheel-img { width: 250px; height: 250px; border-radius: 50%; border: 4px solid #00fbff; transition: 4s cubic-bezier(0.1, 0, 0.2, 1); }
        .spin-now { background: #00fbff; color: black; border: none; padding: 12px 40px; border-radius: 50px; font-weight: bold; margin-top: 15px; font-size: 18px; }
        
        #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .popup-box { background: #222; padding: 30px; border-radius: 20px; border: 2px solid #ffcc00; width: 80%; }
    </style>
</head>
<body>

    <div class="header">
        <span>Mir Hamid</span>
        <span style="color:#00fbff">MIR REWARDS</span>
    </div>

    <div class="wallet-bar">
        <div class="stat">💎 <span id="bal">0</span></div>
        <div class="stat">🎟️ <span id="vch">0</span></div>
    </div>

    <div class="task-top">
        <div style="text-align:left">
            <b style="font-size:18px;">10 Diamonds</b><br>
            <span style="color:#aaa; font-size:12px;">+20 Leaderboard Points</span>
        </div>
        <button class="claim-btn" onclick="claimDaily()">CLAIM</button>
    </div>

    <div class="spin-box">
        <h3 style="color:#ffcc00; margin-top:0;">LUCKY SPIN WHEEL</h3>
        <img src="https://i.ibb.co/3WfK9mS/wheel-placeholder.png" id="wheel" class="wheel-img">
        <br>
        <button class="spin-now" onclick="doSpin()">SPIN NOW</button>
        <p style="font-size:12px; color:#aaa;">Today's Limit: <span id="limit">30</span>/30</p>
        <button onclick="buyVch()" style="background:none; border:1px solid #00fbff; color:#00fbff; padding:5px 15px; border-radius:5px;">Buy 1 Voucher (5 💎)</button>
    </div>

    <div id="popup">
        <div class="popup-box">
            <h2 id="pTitle">Winner!</h2>
            <p id="pMsg"></p>
            <button onclick="closePop()" style="padding:10px 30px; border-radius:5px; background:#ffcc00; border:none; font-weight:bold;">OK</button>
        </div>
    </div>

    <script>
        let diamonds = parseInt(localStorage.getItem("uBal")) || 0;
        let vouchers = parseInt(localStorage.getItem("uVch")) || 0;
        let left = parseInt(localStorage.getItem("uSpins")) ?? 30;

        function update() {
            document.getElementById('bal').innerText = diamonds;
            document.getElementById('vch').innerText = vouchers;
            document.getElementById('limit').innerText = left;
            localStorage.setItem("uBal", diamonds);
            localStorage.setItem("uVch", vouchers);
            localStorage.setItem("uSpins", left);
        }
        update();

        function buyVch() {
            if(diamonds >= 5) { diamonds -= 5; vouchers += 1; update(); alert("Voucher Bought!"); }
            else { alert("Need 5 Diamonds!"); }
        }

        function doSpin() {
            if(vouchers <= 0) return alert("Need Voucher!");
            if(left <= 0) return alert("Limit Reached!");
            
            vouchers -= 1; left -= 1; update();
            document.getElementById('wheel').style.transform = `rotate(${Math.floor(Math.random()*3600)+360}deg)`;
            
            setTimeout(() => {
                let r = Math.random()*100;
                let prize = (r < 0.1) ? 50 : (r < 5) ? 10 : 5;
                diamonds += prize; update();
                showPop("Congratulations!", `You won ${prize} Diamonds!`);
            }, 4000);
        }

        function claimDaily() {
            diamonds += 10; update();
            showPop("Claimed!", "You got 10 Diamonds & 20 Leaderboard Points!");
        }

        function showPop(t, m) {
            document.getElementById('pTitle').innerText = t;
            document.getElementById('pMsg').innerText = m;
            document.getElementById('popup').style.display = 'flex';
        }

        function closePop() { document.getElementById('popup').style.display = 'none'; }
    </script>
</body>
</html>
