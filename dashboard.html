<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MIR FREE REWARDS</title>
    <style>
        body { margin: 0; background: #0b0d0f; color: white; font-family: sans-serif; text-align: center; overflow-x: hidden; }
        .header { background: #1a1c1e; padding: 15px; border-bottom: 2px solid #00fbff; display: flex; justify-content: space-between; align-items: center; }
        .user-img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #00fbff; }
        
        /* Wallet & Stats */
        .wallet { background: rgba(0,251,255,0.05); margin: 10px; padding: 15px; border-radius: 15px; border: 1px solid #00fbff; display: flex; justify-content: space-around; }
        .stat-box { text-align: center; }
        .stat-val { font-size: 24px; color: #00fbff; font-weight: bold; }
        .stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; }

        /* Spin Wheel Section */
        .wheel-container { position: relative; margin: 20px auto; width: 260px; height: 260px; }
        #wheel { width: 100%; height: 100%; border-radius: 50%; border: 5px solid #1a1c1e; transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1); box-shadow: 0 0 20px #00fbff; }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 30px; z-index: 10; filter: drop-shadow(0 0 5px #00fbff); }
        .spin-btn { background: #ffcc00; color: #000; border: none; padding: 12px 40px; border-radius: 50px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 18px; box-shadow: 0 5px 15px rgba(255,204,0,0.4); }
        
        .limit-text { font-size: 12px; color: #ff4444; margin-top: 10px; }

        /* Cards */
        .task-card { background: #1c1f24; margin: 15px; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border-left: 6px solid #ffcc00; }
        .task-info { display: flex; align-items: center; gap: 12px; text-align: left; }

        /* Popups */
        #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .popup-box { background: #fffbe6; color: #333; padding: 30px; border-radius: 20px; width: 80%; }
        .ok-btn { background: #4caf50; color: white; border: none; padding: 12px 45px; border-radius: 10px; margin-top: 15px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="" id="uPic" class="user-img">
            <span id="uName">Loading...</span>
        </div>
        <div style="color:#00fbff; font-weight:bold;">MIR REWARDS</div>
    </div>

    <div class="wallet">
        <div class="stat-box">
            <div class="stat-val">💎 <span id="balance">0</span></div>
            <div class="stat-label">Diamonds</div>
        </div>
        <div class="stat-box">
            <div class="stat-val">🎟️ <span id="vouchers">0</span></div>
            <div class="stat-label">Vouchers</div>
        </div>
    </div>

    <div class="wheel-section">
        <h2 style="margin-bottom:5px; color:#ffcc00;">LUCKY SPIN</h2>
        <div class="wheel-container">
            <img src="https://cdn-icons-png.flaticon.com/512/8215/8215539.png" class="pointer">
            <img src="https://raw.githubusercontent.com/hamidmir12390-creator/Mir-Rewards-/main/spin_wheel.png" id="wheel" onerror="this.src='https://i.ibb.co/3WfK9mS/wheel-placeholder.png'">
        </div>
        <button class="spin-btn" onclick="startSpin()">SPIN NOW</button>
        <div class="limit-text">Today's Spins: <span id="spinLimit">30</span>/30 Left</div>
        <button onclick="buyVoucher()" style="background:none; border:1px solid #00fbff; color:#00fbff; margin-top:10px; padding:5px 15px; border-radius:5px;">Buy 1 Voucher (5 💎)</button>
    </div>

    <div class="task-card" style="margin-top:30px;">
        <div class="task-info">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M6 3L3 8L12 21L21 8L18 3H6Z" fill="#00FBFF" stroke="white" stroke-width="1.5"/></svg>
            <div><b style="font-size:16px;">Daily Reward</b><br><span style="color:#aaa; font-size:12px;">Get free diamonds daily</span></div>
        </div>
        <button class="claim-btn" style="background:#00fbff; color:black; border:none; padding:10px 20px; border-radius:5px; font-weight:bold;" onclick="claimReward()">CLAIM</button>
    </div>

    <div id="popup">
        <div class="popup-box">
            <h2 id="popTitle" style="color:#d4a017;">Congratulations!</h2>
            <p id="popMsg">You Earned Rewards</p>
            <div id="popIcon" style="font-size:50px;">💎</div>
            <button class="ok-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        // Load User Data
        let bal = parseInt(localStorage.getItem("uBal")) || 0;
        let vch = parseInt(localStorage.getItem("uVch")) || 0;
        let spinsLeft = parseInt(localStorage.getItem("uSpins")) ?? 30;

        document.getElementById('balance').innerText = bal;
        document.getElementById('vouchers').innerText = vch;
        document.getElementById('spinLimit').innerText = spinsLeft;
        document.getElementById('uName').innerText = localStorage.getItem("userName") || "User";
        document.getElementById('uPic').src = localStorage.getItem("userPic") || "https://www.w3schools.com/howto/img_avatar.png";

        function updateUI() {
            document.getElementById('balance').innerText = bal;
            document.getElementById('vouchers').innerText = vch;
            document.getElementById('spinLimit').innerText = spinsLeft;
            localStorage.setItem("uBal", bal);
            localStorage.setItem("uVch", vch);
            localStorage.setItem("uSpins", spinsLeft);
        }

        function buyVoucher() {
            if(bal >= 5) {
                bal -= 5; vch += 1; updateUI();
                alert("Voucher Purchased!");
            } else {
                alert("Not enough Diamonds!");
            }
        }

        function startSpin() {
            if(spinsLeft <= 0) return alert("Daily 30 spins limit reached!");
            if(vch <= 0) return alert("You need 1 Voucher to spin!");

            // Ads Placeholder
            alert("Loading Ad for double rewards...");
            
            vch -= 1;
            spinsLeft -= 1;
            updateUI();

            let wheel = document.getElementById('wheel');
            let randomDeg = Math.floor(Math.random() * 3600) + 360;
            wheel.style.transform = `rotate(${randomDeg}deg)`;

            setTimeout(() => {
                calculatePrize();
            }, 4000);
        }

        function calculatePrize() {
            let rand = Math.random() * 100;
            let win = 0;
            let type = "💎";

            if(rand <= 0.001) { win = 1000; }
            else if(rand <= 0.101) { win = 50; }
            else if(rand <= 5.101) { win = 10; }
            else if(rand <= 20.0) { win = 1; type = "🎟️"; } // Voucher Prize
            else if(rand <= 65.0) { win = 5; }
            else { win = 0; } // Better luck next time

            showPopup(win, type);
        }

        function showPopup(amount, type) {
            let pop = document.getElementById('popup');
            if(amount > 0) {
                document.getElementById('popTitle').innerText = "Congratulations!";
                document.getElementById('popMsg').innerText = `You won ${amount} ${type == '💎' ? 'Diamonds' : 'Voucher'}`;
                document.getElementById('popIcon').innerText = type;
                if(type == '💎') bal += amount; else vch += amount;
            } else {
                document.getElementById('popTitle').innerText = "Oops!";
                document.getElementById('popMsg').innerText = "Better Luck Next Time!";
                document.getElementById('popIcon').innerText = "❌";
            }
            pop.style.display = 'flex';
            updateUI();
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        function claimReward() {
            alert("Loading Ad...");
            setTimeout(() => { showPopup(10, '💎'); }, 1000);
        }
    </script>
</body>
</html>
